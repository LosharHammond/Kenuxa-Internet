name: KENUXA cognitive and developmental CI
on:
  push:
    branches:
      - main
      - feature/cross-domain-concepts-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: kenuxa-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check cognitive modules parse
        run: |
          node --check lib/node.mjs
          node --check lib/mind/autonomous-learning.mjs
          node --check lib/mind/foundation-training.mjs
          node --check lib/mind/grammar-induction.mjs
          node --check lib/mind/semantic-proof.mjs
          node --check lib/transformer/worker.mjs
      - name: Run autonomous learning, transformer and regression tests
        run: node --test tests/autonomous-learning.test.mjs tests/foundation-cognition.test.mjs tests/contextual-answer.test.mjs tests/developmental-learning-core.test.mjs tests/semantic-proof.test.mjs tests/transformer.test.mjs
      - name: Run complete Node test suite
        run: npm test
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test deployed Render HTTP endpoints and autonomous training
        env:
          KENUXA_REQUIRE_AUTONOMOUS: 'true'
        run: node scripts/smoke-live.mjs
