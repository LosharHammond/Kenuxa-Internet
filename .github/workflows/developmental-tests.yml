name: Developmental learning tests
on:
  push:
    branches:
      - feature/cross-domain-concepts-v1
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run developmental and concept tests
        run: node --test tests/developmental*.test.mjs tests/concept-discovery.test.mjs
