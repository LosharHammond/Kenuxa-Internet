name: KENUXA continuous integration
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: kenuxa-unified-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quick-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and architecture
        run: |
          node --check lib/node.mjs
          node --check public/chat.js
          node --check lib/mind/program-induction.mjs
          node --check lib/mind/unified-cognition.mjs
          node --check lib/mind/developmental-learning-core.mjs
          node --check lib/mind/growth-coordinator.mjs
          node scripts/check-unified-architecture.mjs
      - name: Unified learning and chatbot regression
        run: node --test tests/program-induction.test.mjs tests/autonomous-skills.test.mjs tests/unified-cognition.test.mjs tests/unified-chatbot.test.mjs tests/contextual-answer.test.mjs tests/growth-coordinator.test.mjs
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Check JavaScript syntax
        run: |
          node --check lib/node.mjs
          node --check lib/mind/autonomous-learning.mjs
          node --check lib/mind/foundation-training.mjs
          node --check lib/mind/foundation-cognition.mjs
          node --check lib/mind/developmental-learning-core.mjs
      - name: Verify unified runtime dependency graph
        run: node scripts/check-unified-architecture.mjs
      - name: Run full regression suite
        run: npm test
      - name: End-to-end node smoke test
        run: node --test tests/autonomous-learning.test.mjs tests/foundation-cognition.test.mjs tests/developmental-learning-core.test.mjs

  deployment-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: node-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify actual Render deployment and chatbot
        env:
          DEPLOYMENT_URL: https://kenuxa-internet.onrender.com
          EXPECTED_COMMIT: ${{ github.sha }}
        run: node scripts/deploy-smoke.mjs
      - name: Verify both Render nodes, signed identities and peer discovery
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: node scripts/smoke-mesh-live.mjs
