# Render blueprint. With SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY set, the free plan works:
# state lives in Supabase, so restarts and redeploys lose nothing. Without Supabase, use a paid
# plan with the persistent disk below.
services:
  - type: web
    name: kenuxa-internet
    runtime: node
    plan: free
    buildCommand: npm ci --ignore-scripts
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ID
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: NETWORK_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PEER_URLS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: CRAWLER_ENABLED
        value: "true"
      - key: TRANSFORMER_PROFILE
        value: nano
      - key: KENUXA_MODE
        value: chat
      - key: PUBLIC_QUESTIONS_PER_DAY
        value: "1000"
