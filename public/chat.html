<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KENUXA</title>
<meta name="description" content="KENUXA — an AI that understands what you mean.">
<meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#fafaf8" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="/chat.css">
<script src="/md.js" defer></script>
<script src="/chat.js" defer></script>
</head>
<body>
<div class="shell" id="shell">
  <aside class="side" id="side" aria-label="Chat history">
    <div class="side-top">
      <a class="logo" href="/" aria-label="KENUXA home"><span class="orb" aria-hidden="true"></span><span class="logo-name" id="brand-name">KENUXA</span></a>
      <button class="icon-btn" id="collapse" type="button" aria-label="Close sidebar" title="Close sidebar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M9.5 4.5v15"/></svg></button>
    </div>
    <button class="new-chat" id="new-chat" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>New chat</span><kbd>Ctrl ⇧ O</kbd></button>
    <label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><input id="search" type="search" placeholder="Search chats" autocomplete="off" aria-label="Search chats"></label>
    <nav class="history" id="history" aria-label="Previous chats"></nav>
    <div class="side-foot">
      <button class="foot-btn" id="theme" type="button" aria-label="Switch theme"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg><span id="theme-label">Theme</span></button>
      <a class="foot-btn hidden" id="studio-link" href="/studio"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7.8 4.5v9L12 21l-7.8-4.5v-9z"/></svg><span>Research studio</span></a>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main class="main">
    <header class="top">
      <button class="icon-btn" id="open-side" type="button" aria-label="Open sidebar" title="Open sidebar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M9.5 4.5v15"/></svg></button>
      <div class="top-title" id="top-title">KENUXA</div>
      <button class="icon-btn" id="new-chat-top" type="button" aria-label="New chat" title="New chat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4l10.5-10.5a2.1 2.1 0 0 0-3-3L5 17z"/><path d="M14 7.5l3 3"/></svg></button>
    </header>
    <section class="thread" id="thread" aria-live="polite">
      <div class="empty" id="empty">
        <div class="hero-orb" aria-hidden="true"><span></span></div>
        <p class="greet" id="greet">Good day</p>
        <h1>What can I help you <span class="grad">understand</span>?</h1>
        <div class="starters" id="starters"></div>
      </div>
      <div class="messages" id="messages"></div>
    </section>
    <div class="dock">
      <form class="composer" id="composer">
        <label class="sr-only" for="input">Message KENUXA</label>
        <textarea id="input" rows="1" maxlength="2000" placeholder="Ask KENUXA anything" autocomplete="off"></textarea>
        <button class="send" id="send" type="submit" aria-label="Send message" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg></button>
      </form>
      <p class="fine">KENUXA answers from what it understands and knows, and says so when it doesn't. Check important information.</p>
    </div>
  </main>
</div>
<div class="toast hidden" id="toast" role="status"></div>
</body>
</html>
